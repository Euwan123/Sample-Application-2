services:
  replica:
    build:
      context: .
      dockerfile: replica/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REPLICA_DB: /app/data/replica.sqlite3
      REPLICA_EXPERIMENT_MODE: "1"
    volumes:
      - ./data:/app/data
    networks:
      - isolated
    restart: unless-stopped

networks:
  isolated:
    internal: true
